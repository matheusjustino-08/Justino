<!DOCTYPE html>
<html lang="pt-BR" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview Visual - Justino UI (.jucode + .css)</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #e2e8f0;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .preview-controls {
            margin-bottom: 20px;
            background: #ffffff;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .preview-controls button {
            background-color: #4a5568;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .preview-controls button:hover {
            background-color: #2d3748;
        }

        .window-wrapper {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border-radius: 12px;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <div class="preview-controls">
        <span><strong>Modo de Idioma & Bidi Layout:</strong></span>
        <button onclick="setMode('pt-BR', 'ltr', 'Bem-vindo à Linguagem Justino!', 'Interface acelerada por GPU e suporte bi-direcional', 'Digite seu nome...', 'Confirmar')">
            🇧🇷 Português (pt-BR - LTR)
        </button>
        <button onclick="setMode('ar-SA', 'rtl', 'مرحباً بك في لغة خوستينو!', 'واجهة واجهة المستخدم المسرعة ورسومات ثنائية الاتجاه', 'أدخل اسمك...', 'تأكيد')">
            🇸🇦 Árabe (ar-SA - RTL)
        </button>
    </div>

    <div class="window-wrapper">
        <window id="app-window">
            <div class="header-container">
                <text id="titulo" class="titulo-app">Bem-vindo à Linguagem Justino!</text>
                <text id="subtitulo" class="subtitulo">Interface acelerada por GPU e suporte bi-direcional (LTR <-> RTL)</text>
            </div>

            <div class="form-box">
                <input id="campo" class="campo-texto" type="text" value="Engenheiro Justino" placeholder="Digite seu nome...">
                <button id="btn-confirmar" class="btn-acao">Confirmar</button>
                <button class="btn-alternar-idioma" onclick="toggleLanguage()">Alternar Idioma</button>
            </div>
        </window>
    </div>

    <script>
        let currentLang = 'pt-BR';

        function setMode(lang, dir, title, subtitle, placeholder, btnText) {
            currentLang = lang;
            document.documentElement.lang = lang;
            document.documentElement.dir = dir;
            document.getElementById('titulo').innerText = title;
            document.getElementById('subtitulo').innerText = subtitle;
            document.getElementById('campo').placeholder = placeholder;
            document.getElementById('btn-confirmar').innerText = btnText;
        }

        function toggleLanguage() {
            if (currentLang === 'pt-BR') {
                setMode('ar-SA', 'rtl', 'مرحباً بك في لغة خوستينو!', 'واجهة واجهة المستخدم المسرعة ورسومات ثنائية الاتجاه', 'أدخل اسمك...', 'تأكيد');
            } else {
                setMode('pt-BR', 'ltr', 'Bem-vindo à Linguagem Justino!', 'Interface acelerada por GPU e suporte bi-direcional (LTR <-> RTL)', 'Digite seu nome...', 'Confirmar');
            }
        }
    </script>

</body>
</html>
